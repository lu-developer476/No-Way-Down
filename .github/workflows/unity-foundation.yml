name: Unity HDRP foundation (manual licensed validation)
on:
  workflow_dispatch:
    inputs:
      unityVersion:
        description: Exact installed Unity 6.3 LTS patch (for example, value copied from Unity Hub)
        required: true
      runBuild:
        description: Build Windows x64 Development after tests
        type: boolean
        default: true
jobs:
  tests-and-build:
    runs-on: ubuntu-latest
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Require explicitly configured Unity license
        shell: bash
        run: |
          test -n "$UNITY_LICENSE" || { echo 'UNITY_LICENSE is not configured; no Unity checks ran.'; exit 1; }
          [[ '${{ inputs.unityVersion }}' == 6000.3.* ]] || { echo 'A real Unity 6.3 LTS patch is required.'; exit 1; }
      - name: EditMode
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: unity/NoWayDown
          unityVersion: ${{ inputs.unityVersion }}
          testMode: EditMode
          artifactsPath: artifacts/editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: PlayMode
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: unity/NoWayDown
          unityVersion: ${{ inputs.unityVersion }}
          testMode: PlayMode
          artifactsPath: artifacts/playmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Windows x64 Development
        if: ${{ inputs.runBuild }}
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: unity/NoWayDown
          unityVersion: ${{ inputs.unityVersion }}
          targetPlatform: StandaloneWindows64
          buildsPath: artifacts/build
          customParameters: -development
      - name: Publish tests, logs, build and benchmark captures when produced
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: unity-${{ inputs.unityVersion }}-results
          path: artifacts
          if-no-files-found: warn
