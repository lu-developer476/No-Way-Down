name: Production deploy gate
on:
  pull_request:
  push: {branches: [main]}
concurrency:
  group: production-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  NWD_BUILD_SHA: ${{ github.sha }}
  E2E_EXPECTED_SHA: ${{ github.sha }}
jobs:
  production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve binary audit base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          echo "event=$EVENT_NAME"
          echo "head SHA=$(git rev-parse HEAD)"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            candidate="$PR_BASE_SHA"
          else
            candidate="$PUSH_BEFORE_SHA"
          fi
          if [[ -n "$candidate" && ! "$candidate" =~ ^0+$ ]] && git rev-parse --verify "${candidate}^{commit}" >/dev/null 2>&1; then
            echo "NWD_DIFF_BASE=$candidate" >> "$GITHUB_ENV"
            echo "base SHA=$candidate"
            echo "merge-base=$(git merge-base "$candidate" HEAD)"
          elif git rev-parse --verify 'HEAD^^{commit}' >/dev/null 2>&1; then
            echo "NWD_DIFF_BASE=$(git rev-parse HEAD^)" >> "$GITHUB_ENV"
            echo "Event base is unavailable; using HEAD^ as NWD_DIFF_BASE"
          else
            echo "Event base and HEAD^ are unavailable; the audit will use its safe empty-tree fallback"
          fi
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: game/package-lock.json}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements.txt}
      - uses: browser-actions/setup-chrome@v1
      - run: npm ci --prefix game
      - run: pip install -r backend/requirements.txt -r game/e2e/requirements.txt
      - run: npm run audit:no-binary-diff --prefix game
      - run: npm run audit:e2e-text-only --prefix game
      - run: npm run audit:protected-assets --prefix game
      - run: npm run audit:campaign --prefix game
      - run: npm run audit:tiled --prefix game
      - run: npm run audit:runtime-reachability --prefix game
      - run: npm run audit:dead-code --prefix game
      - run: npm test --prefix game
      - run: npx tsc --noEmit -p game/tsconfig.json
      - run: npm run build --prefix game
      - run: test -f game/dist/index.html
      - run: test -f game/dist/build-info.json
      - run: npm run audit:deploy-identity --prefix game
      - run: npm run audit:dist-production-art --prefix game
      - run: python backend/manage.py test
      - run: npm run test:e2e:production --prefix game
        env:
          E2E_SKIP_BUILD: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-e2e-evidence-${{ github.sha }}
          if-no-files-found: warn
          path: |
            game/test-results/**/*.txt
            game/test-results/**/*.json
            game/test-results/**/*.log
            game/test-results/**/*.xml
