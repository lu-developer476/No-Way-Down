name: Production deploy gate
on:
  pull_request:
  push: {branches: [main]}
concurrency:
  group: production-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: game/package-lock.json}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements.txt}
      - uses: browser-actions/setup-chrome@v1
      - run: npm ci --prefix game
      - run: pip install -r backend/requirements.txt -r game/e2e/requirements.txt
      - run: npm test --prefix game
      - run: npm run build --prefix game
      - run: python backend/manage.py test
      - run: npm run test:e2e:production --prefix game
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-e2e-evidence-${{ github.sha }}
          if-no-files-found: warn
          path: |
            game/test-results
            game/e2e/visual-baselines/manifest.json
