name: Mirror main snapshot to GitLab

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: mirror-main-to-gitlab
  cancel-in-progress: false

jobs:
  publish-snapshot:
    name: Publish sanitized main snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub main history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Install audit dependencies
        run: npm ci --prefix game

      - name: Audit mirror safety
        run: npm run audit:gitlab-mirror --prefix game

      - name: Publish and verify sanitized snapshot
        env:
          GITHUB_SOURCE_SHA: ${{ github.sha }}
          GITHUB_SOURCE_REF: ${{ github.ref }}
          GITLAB_MIRROR_URL: ${{ secrets.GITLAB_MIRROR_URL }}
          GITLAB_MIRROR_USERNAME: ${{ secrets.GITLAB_MIRROR_USERNAME }}
          GITLAB_MIRROR_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
          NWD_MIRROR_EVIDENCE_FILE: ${{ runner.temp }}/gitlab-mirror-evidence.txt
        run: scripts/mirror-main-snapshot.sh

      - name: Upload verified mirror evidence
        uses: actions/upload-artifact@v4
        with:
          name: gitlab-main-snapshot-${{ github.sha }}
          path: ${{ runner.temp }}/gitlab-mirror-evidence.txt
          if-no-files-found: error
