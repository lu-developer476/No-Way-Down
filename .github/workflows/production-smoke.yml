name: Render production smoke
on:
  workflow_dispatch:
    inputs:
      baseUrl: {description: URL externa, required: true, default: 'https://no-way-down.onrender.com'}
      expectedSha: {description: SHA esperado, required: true}
      runVisualComparison: {description: Comparar baselines, required: true, type: boolean, default: false}
  workflow_run:
    workflows: ['Mirror main snapshot to GitLab']
    types: [completed]
jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_BASE_URL: ${{ github.event_name == 'workflow_run' && 'https://no-way-down.onrender.com' || inputs.baseUrl }}
      E2E_EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.expectedSha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.expectedSha }}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: browser-actions/setup-chrome@v1
      - run: pip install -r game/e2e/requirements.txt
      - name: Wait for Render to publish the expected source SHA
        run: npm run wait:production-sha --prefix game
      - name: Run production smoke
        env:
          E2E_VISUAL_COMPARISON: ${{ inputs.runVisualComparison && '1' || '0' }}
        run: bash game/scripts/runProductionSmoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: render-smoke-evidence-${{ github.run_id }}, path: game/test-results}
